[package]
name = "pos-nativo"
version = "0.2.0"
edition = "2021"
description = "POS nativo de MenuBy"

[lib]
# El nombre con _lib es la convención de Tauri 2: permite que el mismo código
# corra en escritorio y, el día que haga falta, en Android.
name = "pos_nativo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pos-core = { path = "../core" }
# `protocol-asset`: deja que el webview lea archivos del disco por asset://.
# Es lo que permite mostrar las fotos del catálogo sin internet. El alcance
# está acotado en tauri.conf.json a $APPDATA/fotos y a nada más.
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Los ids de operación del datáfono, ordenados en el tiempo como los de venta.
uuid = { version = "1", features = ["v7"] }
rusqlite = { version = "0.32", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
# Habla con los puertos COM sin capas de por medio: es lo que hace que el corte
# de papel y el pulso del cajón salgan en microsegundos.
serialport = "4"
# Cliente HTTP de bloqueo, sin runtime async: la sincronización corre en su
# propio hilo y no vale la pena arrastrar tokio para un POST cada 30 segundos.
ureq = { version = "2", features = ["json"] }
# El token del negocio va al llavero del sistema, no a un archivo: DPAPI en
# Windows, Secret Service en Linux, llavero en macOS.
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust", "apple-native"] }
