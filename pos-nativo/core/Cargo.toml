[package]
name = "pos-core"
version = "0.1.0"
edition = "2021"
description = "Núcleo del POS nativo: dinero, venta, SQLite local y ESC/POS. Sin Tauri."

# Este crate no sabe nada de Tauri ni de ventanas a propósito: es lo que hay que
# poder probar sin hardware, sin interfaz y sin red. La capa nativa (src-tauri)
# solo lo llama.

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["formatting", "macros"] }
# El PIN nunca se guarda en claro. Argon2 es Rust puro: no arrastra OpenSSL ni
# nada que compilar aparte en el equipo del negocio.
argon2 = "0.5"
# El QR del menú en la tirilla, dibujado como imagen para las impresoras que no
# lo generan solas. Sin el soporte de imágenes: solo la matriz de módulos.
qrcode = { version = "0.14", default-features = false }
# La sal aleatoria del PIN. Va aparte porque password-hash no reexporta el
# generador con las features por defecto.
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"
