<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3A7AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#051C2C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="96" cy="96" r="88" fill="url(#grad1)" stroke="#fff" stroke-width="4"/>
  
  <!-- Restaurant icon - simplified -->
  <g fill="white">
    <!-- Plate -->
    <circle cx="96" cy="100" r="32" fill="none" stroke="white" stroke-width="3"/>
    
    <!-- Fork -->
    <g transform="translate(70, 80)">
      <rect x="0" y="0" width="2" height="24" fill="white"/>
      <rect x="-2" y="0" width="1" height="8" fill="white"/>
      <rect x="2" y="0" width="1" height="8" fill="white"/>
      <rect x="-1" y="0" width="1" height="12" fill="white"/>
      <rect x="1" y="0" width="1" height="12" fill="white"/>
    </g>
    
    <!-- Knife -->
    <g transform="translate(118, 80)">
      <rect x="0" y="0" width="2" height="24" fill="white"/>
      <polygon points="0,0 8,4 8,8 0,12" fill="white"/>
    </g>
    
    <!-- MenuBy text -->
    <text x="96" y="140" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">MenuBy</text>
  </g>
</svg>
