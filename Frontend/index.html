<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de gestión de restaurantes digital. Crea tu menú digital, gestiona pedidos y mejora la experiencia de tus clientes." />
    <meta name="keywords" content="restaurante, menú digital, pedidos online, gestión restaurante, QR menú" />
    <meta name="author" content="MenuBy" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#3A7AFF" />
    
    <!-- Prevenir caché en desarrollo -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MenuBy - Sistema de Gestión de Restaurantes" />
    <meta property="og:description" content="Sistema de gestión de restaurantes digital. Crea tu menú digital, gestiona pedidos y mejora la experiencia de tus clientes." />
    <meta property="og:image" content="/icon.svg" />
    <meta property="og:site_name" content="MenuBy" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MenuBy - Sistema de Gestión de Restaurantes" />
    <meta name="twitter:description" content="Sistema de gestión de restaurantes digital. Crea tu menú digital, gestiona pedidos y mejora la experiencia de tus clientes." />
    <meta name="twitter:image" content="/icon.svg" />
    
    <!-- Mobile app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MenuBy" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    
    <!-- Manifest vacío para sobrescribir caché -->
    <link rel="manifest" href="/manifest.json?v=3" />
    
    <title>MenuBy - Sistema de Gestión de Restaurantes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
