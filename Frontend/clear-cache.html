<!DOCTYPE html>
<html>
<head>
    <title>Limpiar Caché - MenuBy</title>
</head>
<body>
    <h1>Limpiando Caché del Navegador...</h1>
    <p id="status">Iniciando limpieza...</p>
    
    <script>
        const statusEl = document.getElementById('status');
        
        async function clearCache() {
            try {
                // 1. Limpiar localStorage
                localStorage.clear();
                statusEl.innerHTML += '<br>✅ LocalStorage limpiado';
                
                // 2. Limpiar sessionStorage
                sessionStorage.clear();
                statusEl.innerHTML += '<br>✅ SessionStorage limpiado';
                
                // 3. Limpiar IndexedDB
                if ('indexedDB' in window) {
                    try {
                        const databases = await indexedDB.databases();
                        for (const db of databases) {
                            indexedDB.deleteDatabase(db.name);
                            statusEl.innerHTML += '<br>✅ IndexedDB eliminado: ' + db.name;
                        }
                    } catch (e) {
                        statusEl.innerHTML += '<br>⚠️ IndexedDB: ' + e.message;
                    }
                }
                
                // 4. Desregistrar todos los service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                        statusEl.innerHTML += '<br>✅ Service Worker desregistrado';
                    }
                }
                
                // 5. Limpiar caché de la API de Cache
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    for (const cacheName of cacheNames) {
                        await caches.delete(cacheName);
                        statusEl.innerHTML += '<br>✅ Caché eliminado: ' + cacheName;
                    }
                }
                
                // 6. Forzar recarga del manifest
                const manifestLinks = document.querySelectorAll('link[rel="manifest"]');
                manifestLinks.forEach(link => {
                    link.href = link.href + '?clear=' + Date.now();
                });
                
                statusEl.innerHTML += '<br><br>🎉 <strong>LIMPIEZA COMPLETA!</strong>';
                statusEl.innerHTML += '<br>Redirigiendo en 3 segundos...';
                
                setTimeout(() => {
                    window.location.href = '/?cachebust=' + Date.now();
                }, 3000);
                
            } catch (error) {
                statusEl.innerHTML += '<br>❌ Error: ' + error.message;
            }
        }
        
        // Ejecutar limpieza automáticamente
        clearCache();
    </script>
</body>
</html>
