# Evolution API — add this service to the main docker-compose.yml on the server.
# Run with: docker-compose -f docker-compose.yml -f docker-compose.evolution.yml up -d
#
# First-time setup after containers start:
#   1. Create instance:
#      curl -X POST http://localhost:8080/instance/create \
#        -H "apikey: YOUR_KEY" -H "Content-Type: application/json" \
#        -d '{"instanceName":"menuby","qrcode":true}'
#   2. Fetch QR:
#      curl http://localhost:8080/instance/qrcode/menuby?image=true \
#        -H "apikey: YOUR_KEY" > qr.png
#      # Open qr.png and scan with WhatsApp on the MenuBy number
#   3. Verify connection:
#      curl http://localhost:8080/instance/connectionState/menuby \
#        -H "apikey: YOUR_KEY"
#      # Should return {"instance":{"state":"open"}}

version: "3.8"

services:
  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      CORS_ORIGIN: "*"
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: "true"
      LOG_LEVEL: ERROR
      LOG_COLOR: "true"
      LOG_BAILEYS: error
      DEL_INSTANCE: "false"
      PROVIDER_HOST: http://localhost:8080
      PROVIDER_PORT: "8080"
      PROVIDER_PREFIX: evolution
      DATABASE_ENABLED: "false"
      DATABASE_PROVIDER: mongodb
      CACHE_REDIS_ENABLED: "false"
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      QRCODE_LIMIT: "30"
      QRCODE_COLOR: "#198754"
    volumes:
      - evolution_data:/evolution/instances
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  evolution_data:
    driver: local
