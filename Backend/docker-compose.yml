services:
  backend:
    build: .
    ports:
      # El puerto del host es variable para el despliegue solapado: el
      # contenedor nuevo se levanta en el otro puerto mientras el viejo sigue
      # atendiendo, y nginx solo cambia cuando el nuevo responde sano.
      - "127.0.0.1:${HOST_PORT:-5000}:5000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
