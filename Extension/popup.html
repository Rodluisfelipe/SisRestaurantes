<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>MenuBy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 268px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #1e293b;
    }

    header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid #f1f5f9;
    }
    header img { width: 22px; height: 22px; border-radius: 6px; }
    header b { font-size: 13px; }
    header span { margin-left: auto; font-size: 11px; color: #94a3b8; }

    .destinos { padding: 8px; display: flex; flex-direction: column; gap: 4px; }

    button.destino {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 11px 12px;
      border: 1px solid #e2e8f0; border-radius: 11px;
      background: #fff; cursor: pointer;
      font-size: 13.5px; font-weight: 700; color: #334155;
      text-align: left;
      transition: background .12s, border-color .12s, transform .06s;
    }
    button.destino:hover { background: #f8fafc; border-color: #cbd5e1; }
    button.destino:active { transform: scale(.98); }
    button.destino .icono {
      width: 28px; height: 28px; border-radius: 8px;
      display: grid; place-items: center; font-size: 14px; color: #fff;
      flex-shrink: 0;
    }
    button.destino kbd {
      margin-left: auto;
      font: 600 10px/1 -apple-system, sans-serif;
      color: #94a3b8; background: #f1f5f9;
      padding: 4px 6px; border-radius: 5px;
    }
    /* El contador va pegado al nombre, no al borde: así se lee como parte de
       "Panel 3" y no como un adorno suelto. */
    button.destino .globo {
      min-width: 19px; height: 19px; padding: 0 5px;
      border-radius: 99px; color: #fff;
      font: 800 10px/19px -apple-system, sans-serif;
      text-align: center;
    }
    .globo.rojo { background: #ef4444; }
    .globo.verde { background: #10b981; }

    footer {
      padding: 9px 14px; border-top: 1px solid #f1f5f9;
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: #94a3b8;
    }
    footer button {
      margin-left: auto; background: none; border: 0; cursor: pointer;
      font: 600 11px/1 inherit; color: #10b981;
    }
    footer button:hover { text-decoration: underline; }

    /* Configuración — cuando todavía no sabemos de qué negocio es */
    .config { padding: 14px; }
    .config p { font-size: 12px; color: #64748b; line-height: 1.5; margin-bottom: 10px; }
    .config label { display: block; font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 5px; }
    .fila { display: flex; align-items: center; gap: 0; }
    .fila .prefijo {
      font-size: 12px; color: #94a3b8; background: #f8fafc;
      border: 1px solid #e2e8f0; border-right: 0;
      border-radius: 9px 0 0 9px; padding: 9px 4px 9px 9px;
      white-space: nowrap;
    }
    .fila input {
      flex: 1; min-width: 0;
      border: 1px solid #e2e8f0; border-radius: 0 9px 9px 0;
      padding: 9px 10px 9px 2px; font-size: 13px; font-family: inherit;
      outline: none;
    }
    .fila input:focus { border-color: #10b981; }
    .config .guardar {
      width: 100%; margin-top: 10px; padding: 10px;
      background: #10b981; color: #fff; border: 0; border-radius: 10px;
      font: 700 13px/1 inherit; cursor: pointer;
    }
    .config .guardar:hover { background: #059669; }
    .config .aviso { margin-top: 8px; font-size: 11px; color: #ef4444; }
    .oculto { display: none; }
  </style>
</head>
<body>
  <div id="pantalla-destinos" class="oculto">
    <header>
      <img src="iconos/favicon-48x48.png" alt="" />
      <b>MenuBy</b>
      <span id="negocio"></span>
    </header>

    <div class="destinos">
      <button class="destino" data-destino="panel">
        <span class="icono" style="background:#f97316">▦</span>
        Panel
        <span class="globo rojo oculto" id="c-pendientes"></span>
        <kbd>Alt+1</kbd>
      </button>
      <button class="destino" data-destino="whatsapp">
        <span class="icono" style="background:#10b981">✆</span>
        WhatsApp
        <span class="globo verde oculto" id="c-sinleer"></span>
        <kbd>Alt+2</kbd>
      </button>
      <button class="destino" data-destino="pos">
        <span class="icono" style="background:#3b82f6">▤</span>
        POS
        <kbd>Alt+3</kbd>
      </button>
    </div>

    <footer>
      <span id="estado">Si ya está abierto, lo trae al frente</span>
      <button id="cambiar">Cambiar</button>
    </footer>
  </div>

  <div id="pantalla-config" class="oculto">
    <div class="config">
      <label for="slug">¿Cuál es tu negocio?</label>
      <p>Es el nombre que sale en la dirección de tu menú.</p>
      <div class="fila">
        <span class="prefijo">menuby.tech/</span>
        <input id="slug" type="text" placeholder="doggitos" autocomplete="off" spellcheck="false" />
      </div>
      <button class="guardar" id="guardar">Guardar</button>
      <p class="aviso oculto" id="aviso">Escribe el nombre de tu negocio.</p>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
