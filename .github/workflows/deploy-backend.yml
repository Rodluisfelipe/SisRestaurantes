name: Deploy Backend

on:
  push:
    branches: [produccion]
    paths:
      - 'Backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1
        with:
          host: 159.203.136.199
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            echo "=== Starting deploy $(date) ==="

            # Traer el código (preservando .env)
            cd /opt/sisrestaurantes
            cp Backend/.env /tmp/.env.backup 2>/dev/null || true
            git fetch origin produccion
            git reset --hard origin/produccion
            cp /tmp/.env.backup Backend/.env 2>/dev/null || true

            # Despliegue solapado: levanta el contenedor nuevo en el otro
            # puerto, lo prueba, y solo entonces mueve nginx y apaga el viejo.
            # Antes se apagaba primero y quedaban 30-60s de 502 en cada deploy.
            chmod +x Backend/deploy.sh
            ./Backend/deploy.sh
