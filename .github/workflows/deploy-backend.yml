name: Deploy Backend

on:
  push:
    branches: [produccion]
    paths:
      - 'Backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1
        with:
          host: 157.245.125.216
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            echo "=== Starting deploy $(date) ==="

            # Pull latest code
            cd /opt/sisrestaurantes
            git fetch origin produccion
            git reset --hard origin/produccion

            # Rebuild and restart container
            cd Backend
            docker compose build --no-cache
            docker compose up -d --wait

            # Cleanup old images
            docker image prune -af

            # Verify health
            sleep 5
            if curl -sf http://localhost:5000/api/health > /dev/null; then
              echo "=== Deploy OK $(date) ==="
            else
              echo "=== HEALTH CHECK FAILED ==="
              docker logs backend-backend-1 --tail 20
              exit 1
            fi
